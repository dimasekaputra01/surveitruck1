<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d66">
<title>Kuesioner Truk — Survei Gate Pelabuhan</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#10202e;--mut:#526474;--line:#c3d0da;--sel:#0b3d66;--onsel:#fff;--acc:#f2a900;--onacc:#10202e;--ok:#0f7a48;--warn:#a85a00;--bad:#b42318;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d141a;--card:#15202a;--ink:#e9eff4;--mut:#9aabb9;--line:#2b3b49;--sel:#4da3ee;--onsel:#06121c;--ok:#4cc38a;--warn:#f0a24b;--bad:#f07a6e}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Bahnschrift,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:0 0 calc(92px + env(safe-area-inset-bottom))}
header{background:#0b3d66;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:5px solid var(--acc)}
header h1{margin:0;font-size:1.25rem;font-weight:700}
header p{margin:3px 0 0;font-size:.8rem;opacity:.85;max-width:60ch}
main{max-width:760px;margin:0 auto;padding:12px}
.card,details{background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin-bottom:12px}
.card{padding:14px}
summary{padding:14px;font-weight:700;font-size:1.02rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--mut)}
details[open] summary::after{content:"▴"}
details[open] summary{border-bottom:1.5px solid var(--line);margin-bottom:12px}
summary small{font-weight:400;color:var(--mut);margin-left:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:0 14px 14px}
.card .g{padding:0}
.fld{grid-column:1/-1;min-width:0}.fld.half{grid-column:auto}
label{display:block;font-size:.84rem;color:var(--mut);margin-bottom:4px;font-weight:600}
input,select{width:100%;min-height:48px;padding:8px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chips button{flex:1 1 auto;min-height:48px;padding:6px 12px;font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.chips button{flex:0 0 auto;min-height:42px}
.chips+input{margin-top:8px}
.seg .on,.chips .on{background:var(--sel);color:var(--onsel);border-color:var(--sel)}
.ph{display:flex;min-height:64px;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:8px;color:var(--mut);font-weight:600;cursor:pointer;overflow:hidden}
.ph img{display:block;max-height:150px;max-width:100%}
.btn{min-height:48px;padding:0 14px;font:inherit;font-weight:700;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.save{flex:1;background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.danger{color:var(--bad)}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1.5px solid var(--line)}
#list{max-height:340px;overflow-y:auto;margin:8px 0}
.ri{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.ri small{color:var(--mut);display:block}
.bd{display:inline-block;margin-left:4px;padding:2px 7px;border-radius:99px;font-size:.78rem;font-weight:700;border:1.5px solid currentColor}
.bd.o{color:var(--ok)}.bd.w{color:var(--warn)}
.mut{color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#10202e;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
<h1>Kuesioner Truk — Survei Gate Pelabuhan</h1>
<p>Kajian Strategi Terintegrasi Pengembangan Pelabuhan di Pulau Jawa dan Transshipment Hub</p>
</header>
<main>
<div class="card"><div class="g">
<div class="fld"><label for="sn">Nama surveyor</label><input id="sn" autocomplete="name"></div>
<div class="fld half"><label for="tg">Hari / Tanggal</label><input id="tg" type="date"></div>
<div class="fld half"><label for="sh">Shift</label><select id="sh"></select></div>
<div class="fld"><label for="lk">Lokasi survei</label><input id="lk" placeholder="mis. Gate Terminal Teluk Lamong"></div>
</div></div>
<div id="f"></div>
<div class="card">
<b>Data tersimpan: <span id="n">0</span> truk</b> <small class="mut" id="mem"></small>
<div id="list"></div>
<div class="acts">
<button class="btn save" id="kirim" style="flex:none">Kirim ke Spreadsheet (<span id="pend">0</span>)</button>
<button class="btn" id="csv">Unduh CSV</button>
<button class="btn" id="tsv">Salin untuk Excel</button>
<button class="btn" id="json">Cadangan + foto</button>
<button class="btn danger" id="clr">Kosongkan</button>
</div>
<p class="mut" style="font-size:.84rem;margin:10px 0 0">Data tersimpan di perangkat ini dan tetap ada walau sinyal hilang. Unduh CSV di akhir setiap shift.</p>
</div>
</main>
<div id="bar">
<button class="btn" id="cp">Salin truk sebelumnya</button>
<button class="btn" id="cx" hidden>Batal</button>
<button class="btn danger" id="del" hidden>Hapus</button>
<button class="btn save" id="sv">Simpan &amp; truk berikutnya</button>
</div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const ld=(k,d)=>{try{return JSON.parse(LS.getItem(k))??d}catch{return d}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2400)}
const sv=(k,v)=>{try{LS.setItem(k,JSON.stringify(v));return true}catch{toast('Penyimpanan penuh. Unduh cadangan lalu kosongkan data.',1);return false}};
const SHIFT=['Shift 4 (00:00–06:00)','Shift 1 (06:00–12:00)','Shift 2 (12:00–18:00)','Shift 3 (18:00–24:00)'];
const nowHM=()=>new Date().toTimeString().slice(0,5);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

/* Skema: [kunci, label, tipe, opsi]  opsi=1 → saran otomatis; array → pilihan cepat */
const S=[
{t:'Halaman 1 · Responden & kendaraan',open:1,f:[
['waktu','Waktu survei','time'],['resp','Nama responden','text'],['foto','Foto kendaraan','foto'],
['ekspedisi','Perusahaan ekspedisi','text',1],['pelayaran','Perusahaan pelayaran','text',1]]},
{t:'Halaman 2 · Muatan & rute',open:1,f:[
['asal','Asal petikemas (perusahaan, kota)','text',1],
['tujuan','Tujuan petikemas (perusahaan, kota)','text',1],
['komoditas','Komoditas petikemas','text',1],
['isi','Kondisi petikemas','seg',['Isi','Kosong']],
['berat','Berat muatan (ton)','num'],
['kap','Kapasitas (20/40)','seg',['20','40']],
['depo','Posisi depo','seg',['Asal depo (A1)','Tujuan depo (T1)','Bukan depo (kosong)']],
['rute','Rute perjalanan','text',1]]},
{t:'Halaman 3–4 · Perjalanan & biaya',sub:'opsional',f:[
['berangkat','Berangkat pukul','time'],['tiba','Tiba pukul','time'],
['lalin','Kondisi jalan','seg',['Normal','Macet']],
['fh','Frekuensi per hari','num'],['fm','Frekuensi per minggu','num'],
['bbm','Kebutuhan BBM (liter)','num'],['saku','Uang saku / perjalanan (Rp)','rp'],
['sakuuse','Kegunaan uang saku','multi',['Makan','Parkir','Tol','Pungutan']],
['upahS','Upah supir (Rp/bln)','rp'],['upahA','Upah asisten supir (Rp/bln)','rp'],
['rawat','Biaya perawatan (Rp/bln)','rp'],['asur','Asuransi dari perusahaan (Rp, 0 = tidak)','rp'],
['bonus','Upah tambahan / bonus (Rp, 0 = tidak)','rp'],['tIsi','Tarif pengiriman isi (Rp/TEU)','rp'],
['tKos','Tarif pengiriman kosong (Rp/TEU)','rp'],
['kendala','Kendala di perjalanan','multi',['Jalan macet','Kondisi gate buruk','Jalan berlubang']]]}
];
const F=S.flatMap(s=>s.f),T={};F.forEach(f=>T[f[0]]=f[2]);
const P1=['waktu','resp','foto','ekspedisi','pelayaran'],P2=['asal','tujuan','komoditas','isi','berat','kap','depo','rute'];

function fld([k,l,t,o]){
 const half=['time','num','rp'].includes(t)||k=='resp'||k=='kap';
 const b=v=>`<button type="button" data-v="${esc(v)}">${esc(v)}</button>`;
 let h;
 if(t=='seg')h=`<div class="seg" data-k="${k}">${o.map(b).join('')}</div>`;
 else if(t=='multi')h=`<div class="chips" data-k="${k}">${o.map(b).join('')}</div><input data-x="${k}" placeholder="Lainnya…" autocomplete="off">`;
 else if(t=='foto')h=`<label class="ph"><input type="file" accept="image/*" capture="environment" id="ph" hidden><span id="phv"></span></label>`;
 else h=`<input data-k="${k}" type="${t=='time'?'time':'text'}" ${t=='num'?'inputmode="decimal"':t=='rp'?'inputmode="numeric"':''} ${o===1?`list="l_${k}"`:''} autocomplete="off" enterkeyhint="next">${o===1?`<datalist id="l_${k}"></datalist>`:''}`;
 return `<div class="fld${half?' half':''}"><label>${l}</label>${h}</div>`;
}
$('#f').innerHTML=S.map(s=>`<details${s.open?' open':''}><summary><span>${s.t}${s.sub?`<small>${s.sub}</small>`:''}</span></summary><div class="g">${s.f.map(fld).join('')}</div></details>`).join('');

const el=k=>$(`[data-k=${k}]`);
let photo='';
function setPhoto(d){photo=d||'';$('#phv').innerHTML=photo.startsWith('data:')?`<img src="${photo}" alt="Foto kendaraan">`:photo?'Foto sudah di Drive. Tap untuk ganti':'Ambil foto kendaraan'}
function get(k){const t=T[k];if(t=='foto')return photo;const e=el(k);
 if(t=='seg')return e.querySelector('.on')?.dataset.v||'';
 if(t=='multi')return [...e.querySelectorAll('.on')].map(b=>b.dataset.v).concat($(`[data-x=${k}]`).value.trim()||[]).join('; ');
 return e.value.trim()}
function set(k,v=''){const t=T[k];if(t=='foto')return setPhoto(v);const e=el(k);
 if(t=='seg')e.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
 else if(t=='multi'){const p=v?v.split('; '):[],o=[...e.querySelectorAll('button')];o.forEach(b=>b.classList.toggle('on',p.includes(b.dataset.v)));$(`[data-x=${k}]`).value=p.filter(x=>!o.some(b=>b.dataset.v==x)).join('; ')}
 else e.value=v}

$('#ph').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{const r=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setPhoto(c.toDataURL('image/jpeg',.75));URL.revokeObjectURL(im.src)};
 im.src=URL.createObjectURL(f);e.target.value=''};

/* Waktu survei diisi otomatis saat pengisian truk dimulai */
let started=false,editId=null;
const touch=e=>{if(!started&&!editId&&e.target.dataset?.k!='waktu'){started=true;set('waktu',nowHM())}};
$('#f').addEventListener('focusin',touch);
$('#f').addEventListener('click',e=>{touch(e);const b=e.target.closest('button[data-v]');if(!b)return;const p=b.parentNode;
 if(p.classList.contains('seg')){const was=b.classList.contains('on');p.querySelectorAll('button').forEach(x=>x.classList.remove('on'));if(!was)b.classList.add('on')}
 else b.classList.toggle('on')});
$('#f').addEventListener('input',e=>{const t=e.target;if(T[t.dataset.k]=='rp')t.value=t.value.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.')});

/* Saran otomatis dari isian sebelumnya */
let H=ld('sg_h',{});
function fillDL(){F.forEach(([k,,,o])=>{if(o===1)$('#l_'+k).innerHTML=(H[k]||[]).map(v=>`<option value="${esc(v)}">`).join('')})}
function remember(r){F.forEach(([k,,,o])=>{if(o===1&&r[k])H[k]=[r[k],...(H[k]||[]).filter(v=>v!=r[k])].slice(0,40)});sv('sg_h',H);fillDL()}

/* Header sesi */
const hd=ld('sg_hd',{});
$('#sn').value=hd.sn||'';$('#lk').value=hd.lk||'';$('#tg').value=today();
$('#sh').innerHTML=SHIFT.map(s=>`<option>${s}</option>`).join('');$('#sh').value=SHIFT[Math.floor(new Date().getHours()/6)];
['sn','lk'].forEach(i=>$('#'+i).onchange=()=>sv('sg_hd',{sn:$('#sn').value.trim(),lk:$('#lk').value.trim()}));

/* Data */
let R=ld('sg_r',[]);
const miss=(r,a)=>a.filter(k=>!r[k]).length;
const bd=(n,l)=>`<span class="bd ${n?'w':'o'}">${l} ${n?'−'+n:'✓'}</span>`;
function render(){
 $('#n').textContent=R.length;pend();mem();
 $('#list').innerHTML=R.length?R.map((r,i)=>[r,i]).reverse().map(([r,i])=>`<div class="ri" data-id="${r.id}"><b>#${i+1}</b><div>${esc(r.waktu)} · ${esc(r.resp||'tanpa nama')}<small>${esc(r.ekspedisi||'—')} / ${esc(r.pelayaran||'—')}</small></div><div>${bd(miss(r,P1),'H1')}${bd(miss(r,P2),'H2')}</div></div>`).join(''):'<p class="mut">Belum ada data. Isi truk pertama di atas.</p>';
}
function mode(){$('#sv').textContent=editId?'Simpan perubahan':'Simpan & truk berikutnya';$('#cp').hidden=!!editId;$('#cx').hidden=$('#del').hidden=!editId}
function reset(){editId=null;started=false;Object.keys(T).forEach(k=>set(k,''));set('waktu',nowHM());mode();scrollTo({top:0})}
function save(){
 const r={id:editId||Date.now()};
 if(editId){const o=R.find(x=>x.id==editId);['sn','tg','sh','lk'].forEach(k=>r[k]=o[k])}
 else{r.sn=$('#sn').value.trim();r.tg=$('#tg').value;r.sh=$('#sh').value;r.lk=$('#lk').value.trim()}
 Object.keys(T).forEach(k=>r[k]=get(k));
 if(!r.resp&&!r.asal&&!r.tujuan&&!r.ekspedisi){toast('Isi minimal nama responden, ekspedisi, atau asal/tujuan.',1);return}
 R=editId?R.map(x=>x.id==editId?r:x):[...R,r];
 let ok=sv('sg_r',R),lost=false;
 if(!ok&&(r.foto||'').startsWith('data:')){r.foto='';ok=sv('sg_r',R);lost=true}
 remember(r);
 if(lost)toast('Memori penuh: data tersimpan, foto TIDAK. Kirim ke Sheet dulu.',1);
 else if(ok)toast(editId?'Perubahan tersimpan':`Truk #${R.length} tersimpan`);
 reset();render();
}
$('#sv').onclick=save;
$('#cx').onclick=reset;
$('#del').onclick=()=>{if(confirm('Hapus data truk ini?')){R=R.filter(x=>x.id!=editId);sv('sg_r',R);toast('Data dihapus');reset();render()}};
$('#cp').onclick=()=>{const p=R[R.length-1];if(!p)return toast('Belum ada truk sebelumnya.',1);
 started=true;set('waktu',nowHM());Object.keys(T).forEach(k=>{if(!['waktu','resp','foto','berangkat','tiba'].includes(k))set(k,p[k])});toast('Data truk sebelumnya disalin. Ubah yang berbeda.')};
$('#list').onclick=e=>{const d=e.target.closest('[data-id]');if(!d)return;const r=R.find(x=>x.id==d.dataset.id);if(!r)return;
 editId=r.id;started=true;Object.keys(T).forEach(k=>set(k,r[k]));mode();scrollTo({top:$('#f').offsetTop-8,behavior:'smooth'})};

/* Ekspor */
const rows=()=>[['No','Surveyor','Hari/Tanggal','Shift','Lokasi survei',...F.map(f=>f[1])],
 ...R.map((r,i)=>[i+1,r.sn,r.tg,r.sh,r.lk,...F.map(([k])=>k=='foto'?(r.foto?'Ada':''):T[k]=='rp'?String(r[k]||'').replace(/\./g,''):r[k])])];
function dl(n,txt,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
const stamp=()=>`${$('#tg').value||today()}`;
$('#csv').onclick=()=>{if(!R.length)return toast('Belum ada data.',1);
 dl(`survei-truk_${stamp()}.csv`,'\ufeffsep=,\r\n'+rows().map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};
$('#tsv').onclick=async()=>{if(!R.length)return toast('Belum ada data.',1);
 try{await navigator.clipboard.writeText(rows().map(r=>r.map(v=>String(v??'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n'));toast('Tersalin. Tempel di Excel atau Google Sheets.')}catch{toast('Gagal menyalin. Gunakan Unduh CSV.',1)}};
$('#json').onclick=()=>{if(!R.length)return toast('Belum ada data.',1);dl(`cadangan-survei-truk_${stamp()}.json`,JSON.stringify({dibuat:new Date().toISOString(),data:R}),'application/json')};
$('#clr').onclick=()=>{if(R.length&&confirm(`Hapus semua ${R.length} data di perangkat ini? Pastikan sudah diunduh.`)&&confirm('Yakin? Tindakan ini tidak bisa dibatalkan.')){R=[];sv('sg_r',R);reset();render()}};

/* === Kirim ke Google Sheets + Drive ===
   Isi SHEET_URL dengan Web app URL dari Apps Script (akhiran /exec).
   SECRET harus sama persis dengan SECRET di Code.gs. */
const SHEET_URL='https://script.google.com/macros/s/AKfycbzQ2DB9GmqU5FEibwnVGReAv-znIFGab5ABxtmzR621rmgHm1GPpRzy6Z0X7kq8EY2b/exec';
const SECRET='truk-gate-9f3k2m7x';
let SENT=ld('sg_s',{});
const sigD=r=>JSON.stringify([r.sn,r.tg,r.sh,r.lk,...F.map(([k])=>k=='foto'?'':r[k])]);
const sigF=r=>r.foto?r.foto.length+r.foto.slice(-40):'';
const needD=r=>(SENT[r.id]||{}).d!==sigD(r);
const needF=r=>(r.foto||'').startsWith('data:')&&(SENT[r.id]||{}).f!==sigF(r);
function mem(){let n=0;try{Object.keys(LS).forEach(k=>n+=k.length+LS[k].length)}catch{}const p=Math.round(n/5e6*100),e=$('#mem');e.textContent=`· memori ${p}%${p>70?' (kirim ke Sheet sekarang)':''}`;e.style.color=p>70?'var(--bad)':''}
function pend(){$('#pend').textContent=R.filter(r=>needD(r)||needF(r)).length}
async function post(o){
 const x=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({secret:SECRET,...o})});
 const j=await x.json();
 if(!j.ok)throw new Error(j.error||'gagal');
 return j;
}
const rowOf=(r,i)=>[i+1,r.sn,r.tg,r.sh,r.lk,...F.map(([k])=>k=='foto'?'':T[k]=='rp'?String(r[k]||'').replace(/\./g,''):r[k]),String(r.id)];
$('#kirim').onclick=async()=>{
 if(!SHEET_URL.startsWith('https://'))return toast('Alamat skrip (SHEET_URL) belum diisi di index.html.',1);
 if(!navigator.onLine)return toast('Belum ada internet. Coba lagi nanti.',1);
 const btn=$('#kirim'),hdr=[...rows()[0],'ID'];
 btn.disabled=true;let ok=0,gagal=0,err='';
 for(const [i,r] of R.entries()){
  let w=false;
  try{
   if(needD(r)){await post({action:'row',header:hdr,row:rowOf(r,i)});SENT[r.id]={...SENT[r.id],d:sigD(r)};sv('sg_s',SENT);w=true}
   if(needF(r)){await post({action:'foto',id:String(r.id),foto:r.foto});SENT[r.id]={...SENT[r.id],f:sigF(r)};sv('sg_s',SENT);r.foto='drive';w=true}
  }catch(e){gagal++;err=e.message;if(!navigator.onLine)break}
  if(w)ok++;
 }
 btn.disabled=false;sv('sg_r',R);render();
 toast(gagal?`${ok} truk terkirim, ${gagal} gagal${err?' ('+err+')':''}. Coba lagi nanti.`:ok?`${ok} truk terkirim ke Sheet`:'Semua data sudah terkirim',!!gagal);
};

fillDL();reset();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
